<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./olum-ui.min.css" />
    <title>Humidity sensor</title>
    <style>
      main {
        justify-items: center;
        padding: 50px;
        grid-gap: 20px;
        font-size: 20px;
      }
      #error {
        text-align: center;
        color: firebrick;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <div id="error"></div>
    <main class="o-grid">
      <span class="col=1:2 row=1:2">Humidity</span>
      <span class="col=2:3 row=1:2">Temperature</span>
      <span id="humidity" class="col=1:2 row=2:3">0 %</span>
      <span id="temp" class="col=2:3 row=2:3">0 c</span>
    </main>
  </body>
</html>
